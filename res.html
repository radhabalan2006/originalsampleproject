<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zing Food Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url("https://cdn.grapesjs.com/workspaces/cmleo45i13iqug8fwxxx6uuqz/assets/3371d7d5-5d5b-49ea-92e9-8f49f8eb5813__fo2.jpg");
      background-repeat: repeat;
    }

    header {
      background-color: #fbddbF;
      text-align: center;
      padding: 20px;
      font-size: 36px;
      font-weight: bold;
    }

    .note {
      text-align: center;
      padding: 10px 20px;
      font-size: 16px;
      color: #444;
    }

    .container {
      width: 80%;
      margin: auto;
      background: rgba(255,255,255,0.9);
      padding: 20px;
      border-radius: 8px;
    }

    h2 {
      background: #d3c8c8;
      padding: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
    }

    textarea {
      height: 80px;
    }

    .suggestions {
      margin-top: 20px;
    }

    .suggestions p {
      font-size: 16px;
      margin: 8px 0;
    }

    .logo {
      text-align: right;
    }

    .logo img {
      width: 120px;
    }
  </style>
</head>

<body>

  <header>ZING FOOD ORDER</header>

  <div class="note">
    Kindly complete this form. If any ingredients are required, please contact us at the number provided.
    Your order will be delivered as soon as possible.
  </div>

  <div class="container">

    <div class="logo">
      <img src="https://cdn.grapesjs.com/workspaces/cmleo45i13iqug8fwxxx6uuqz/assets/f761cbe4-d993-4269-b04d-4049cd554982__food1.jpg">
    </div>

    <h2>ORDER INFORMATION</h2>

    <div class="form-group">
      <label>Name</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email">
    </div>

    <div class="form-group">
      <label>Contact No</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Order Details</label>
      <textarea></textarea>
    </div>

    <h2>SUGGESTION ITEMS</h2>

    <div class="suggestions">
      <p>🍗 Pepper chicken with butter naan</p>
      <p>🍗 Chettinad chicken with mutton biriyani</p>
    </div>

  </div>

</body>
</html>
